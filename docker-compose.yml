# Local dev only - Supabase Postgres for reference.
# Production DB is hosted Supabase. FastAPI connects via DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ventapos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
